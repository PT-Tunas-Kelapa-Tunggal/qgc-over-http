name: Build & Release Headless QGC Engine

on:
  push:
    tags:
      - 'http-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release (e.g., http-api-v0.1.0)'
        required: true
        default: 'http-api-v0.1.0'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Setup (Qt 6.11.1 & CCache)
        uses: ./.github/actions/build-setup
        with:
          qt-host: mac
          qt-arch: clang_64
          build-type: Release

      - name: Configure CMake
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: build
          build-type: Release
          extra-args: >-
            -DQGC_ENABLE_GST_VIDEOSTREAMING=OFF
            -DQGC_MACOS_UNIVERSAL_BUILD=OFF
            -DQGC_BUILD_TESTING=OFF
            -DQGC_MACOS_SIGN_WITH_IDENTITY=OFF

      - name: Build QGroundControl
        uses: ./.github/actions/cmake-build
        with:
          build-dir: build
          build-type: Release

      - name: Bundle Qt Frameworks & Stage App Bundle
        uses: ./.github/actions/cmake-install
        with:
          build-dir: build
          build-type: Release

      - name: Package Release Tarball & Compute Checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          
          # Stage directory created by cmake --install
          echo "Packaging QGroundControl.app from build/staging into compressed tarball..."
          tar -czf QGroundControl-macOS-arm64.tar.gz -C build/staging QGroundControl.app
          
          # Generate SHA-256 checksum
          shasum -a 256 QGroundControl-macOS-arm64.tar.gz > QGroundControl-macOS-arm64.tar.gz.sha256
          CHECKSUM=$(awk '{print $1}' QGroundControl-macOS-arm64.tar.gz.sha256)
          echo "sha256=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          
          echo "=== Artifact Details ==="
          ls -lh QGroundControl-macOS-arm64.tar.gz*
          echo "SHA-256: ${CHECKSUM}"

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "QGC Companion Engine ${{ steps.release_tag.outputs.tag }}"
          body: |
            Automated companion headless engine release for macOS Apple Silicon (`arm64`).
            
            ### Included Components
            - Standalone headless QGroundControl engine.
            - Embedded `GET /healthz` endpoint on port `18080`.
            - Bundled Qt 6.11.1 runtime, plugins, and ad-hoc code signature.
            - Optimized build: GStreamer and unit tests disabled.
            
            ### SHA-256 Checksum
            ```
            ${{ steps.package.outputs.sha256 }}  QGroundControl-macOS-arm64.tar.gz
            ```
          files: |
            QGroundControl-macOS-arm64.tar.gz
            QGroundControl-macOS-arm64.tar.gz.sha256
          draft: false
          prerelease: false
